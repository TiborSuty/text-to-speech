[project]
name = "text-to-speech"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastapi",
    "fugashi>=1.5.2",
    "jaconv>=0.5.0",
    "kokoro>=0.9.4",
    "langchain-core>=1.5.1",
    "langchain-ollama>=1.1.0",
    "misaki[zh]>=0.9.4",
    "minio>=7.2.18",
    "mojimoji>=0.0.13",
    "numpy>=2.5.1",
    "pyopenjtalk>=0.4.1",
    "soundfile>=0.14.0",
    "unidic-lite>=1.0.8",
    "uvicorn",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "sqlalchemy>=2.0.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
